services:
  postgres:
    image: postgres:17-alpine
    container_name: vladify-admin-api-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${DbName}
      POSTGRES_USER: ${DbUser}
      POSTGRES_PASSWORD: ${DbPassword}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DbUser} -d ${DbName}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Vladify.AdminApi/Dockerfile
    container_name: vladify-admin-api
    env_file:
      - .env
    ports:
      - "8082:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__AdminApiDb: "Host=postgres;Port=5432;Database=${DbName};Username=${DbUser};Password=${DbPassword}"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
